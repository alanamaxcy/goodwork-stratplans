name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20. @supabase/supabase-js reaches for a native WebSocket and
          # Node only grew one in 22 — on 20 the realtime client throws
          # "native WebSocket not found" and every access-function test fails
          # for a reason that has nothing to do with the code under test.
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Plan editor logic (renumbering, task migration)
        run: node test/plan-edit.mjs
      - name: Access function — every refusal it has to make itself
        run: node test/team-fn.mjs
      - name: Regenerate the public demo data and assert it identifies nobody
        run: node scripts/make-demo.mjs
      - name: Fail if the generated demo data drifted from the scrubber
        run: git diff --exit-code -- data/demo-plan.js data/demo-findings.js
      # The package, then the browser. Adding playwright to package.json would
      # desync package-lock.json and break `npm ci` above; --no-save installs it
      # for this job only and leaves the lockfile alone. test/smoke.mjs resolves
      # the bare specifier first and falls back to the dev container's copy.
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Build and drive the app end to end
        run: node test/smoke.mjs
      - name: Seed loads a portal with no service-role key
        run: node test/seed.mjs

  rls:
    # The permission boundary is the product's only real security control.
    # It runs against a real Postgres on every push, because a boundary is only
    # as good as the test that guards it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Apply the schema and assert who can read and write what
        run: |
          # initdb refuses to run as root, so this runs as `postgres` — but the
          # runner's workspace under /home/runner/work is not traversable by
          # that user, so psql got "schema.sql: Permission denied" before a
          # single assertion ran. Work from a world-readable copy instead of
          # loosening permissions on the checkout. test-rls.sh resolves
          # schema.sql relative to its own location, so the directory moves as
          # a unit.
          # /tmp, NOT $RUNNER_TEMP: that lives under /home/runner/work too, so
          # copying there hit the same wall one directory over — "Permission
          # denied" on the script itself this time instead of on schema.sql.
          rm -rf /tmp/spp-supabase
          cp -r supabase /tmp/spp-supabase
          chmod -R a+rX /tmp/spp-supabase
          sudo -u postgres env PATH="$PATH" TMPDIR=/tmp \
            bash /tmp/spp-supabase/test-rls.sh

