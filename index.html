<title>Resonate Plan Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" />

<style>
  :root {
    --paper: #f5f4f1;
    --surface: #ffffff;
    --raise: #faf9f7;
    --ink: #15181e;
    --ink-2: #565d68;
    --ink-3: #8b919b;
    --rule: #ded9d1;
    --rule-2: #ebe8e2;
    --accent: #4f3d9e;
    --accent-soft: #eeeaf8;
    --accent-line: #c9bfe8;
    --on-accent: #ffffff;
    --s: #3d7a55;
    --w: #a9752a;
    --o: #2b5f8a;
    --t: #98423c;
    --s-soft: #e6efe9;
    --w-soft: #f5ece0;
    --o-soft: #e5edf4;
    --t-soft: #f5e6e4;
    /* Status palette — validated for CVD and normal-vision separation against
       both surfaces. "next" is deliberately a recessive neutral: it fails a
       chroma floor on purpose, and every chart using it carries a legend,
       direct labels and a table view. */
    --st-done: #2e7d4f;
    --st-doing: #2563a8;
    --st-next: #9aa0aa;
    --st-blocked: #a63a30;
    --stop: #a63a30;
    --shadow: 0 1px 2px rgba(20, 24, 30, .05), 0 6px 18px -10px rgba(20, 24, 30, .16);
    --display: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --rail: 248px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #13161b; --surface: #1a1e24; --raise: #20242b;
      --ink: #e9e7e2; --ink-2: #a5abb6; --ink-3: #767d89;
      --rule: #2f343c; --rule-2: #252a31;
      --accent: #a89af2; --accent-soft: #272044; --accent-line: #473b7a; --on-accent: #14121f;
      --s: #6cb68a; --w: #d6a860; --o: #74a6d6; --t: #d6857e;
      --s-soft: #1c2c23; --w-soft: #2e2519; --o-soft: #1b2733; --t-soft: #2f1f1e;
      --st-done: #45936a; --st-doing: #5486cc; --st-next: #4b525c; --st-blocked: #c96a60;
      --stop: #c96a60;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --paper: #13161b; --surface: #1a1e24; --raise: #20242b;
    --ink: #e9e7e2; --ink-2: #a5abb6; --ink-3: #767d89;
    --rule: #2f343c; --rule-2: #252a31;
    --accent: #a89af2; --accent-soft: #272044; --accent-line: #473b7a; --on-accent: #14121f;
    --s: #6cb68a; --w: #d6a860; --o: #74a6d6; --t: #d6857e;
    --s-soft: #1c2c23; --w-soft: #2e2519; --o-soft: #1b2733; --t-soft: #2f1f1e;
    --st-done: #45936a; --st-doing: #5486cc; --st-next: #4b525c; --st-blocked: #c96a60;
    --stop: #c96a60;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { margin: 0; font-weight: 500; text-wrap: balance; }
  p, blockquote, figure { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: var(--accent); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- masthead ---------- */
  .masthead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--rule); }
  .masthead-in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 auto; }
  .brand-name { font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .brand-sub { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mast-right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--raise); }
  .seg button { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 5px 11px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .whoami { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--mono); font-size: 10px; font-weight: 600; flex: 0 0 auto; }
  .syncpill { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; }
  .syncpill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .syncpill.live::before { background: var(--st-done); }

  /* ---------- nav layer two ---------- */
  .subnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 28; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .subnav-in { display: flex; gap: 3px; align-items: center; overflow-x: auto; padding: 7px 20px; scrollbar-width: none; }
  .subnav-in::-webkit-scrollbar { display: none; }
  .subnav button { white-space: nowrap; padding: 5px 11px; border-radius: 7px; font-size: 13px; color: var(--ink-2); border: 1px solid transparent; }
  .subnav button:hover { background: var(--rule-2); }
  .subnav button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); font-weight: 500; }
  .sn-sep { width: 1px; height: 18px; background: var(--rule); margin: 0 6px; flex: 0 0 auto; }
  .sn-spacer { flex: 1 1 auto; min-width: 8px; }

  .layout { display: flex; align-items: flex-start; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); flex: 0 0 var(--rail); width: var(--rail); padding: 20px 14px 32px 20px; border-right: 1px solid var(--rule); align-self: stretch; min-height: calc(100vh - 96px); }
  .railnav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 24px; }
  .railnav button { display: grid; grid-template-columns: 22px 1fr auto; align-items: baseline; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 7px; color: var(--ink-2); border-left: 2px solid transparent; }
  .railnav button:hover { background: var(--rule-2); }
  .railnav button[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); color: var(--ink); }
  .railnav .rn-n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .railnav button[aria-current="true"] .rn-n { color: var(--accent); }
  .railnav .rn-t { font-size: 14px; font-weight: 450; }
  .railnav .rn-c { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .railcard { border-top: 1px solid var(--rule); padding-top: 15px; }
  .railcard + .railcard { margin-top: 16px; }
  .railcard h4 { margin-bottom: 9px; }

  .main { flex: 1 1 auto; min-width: 0; padding: 24px 24px 80px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .tabstrip { display: none; }

  /* ---------- section headers ---------- */
  .shead { margin-bottom: 20px; }
  .shead h2 { font-family: var(--display); font-size: 27px; letter-spacing: -.015em; margin-top: 3px; }
  .shead p { color: var(--ink-2); margin-top: 7px; max-width: 64ch; }
  .callout { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--rule); border-left: 2px solid var(--accent); background: var(--raise); border-radius: 0 8px 8px 0; padding: 11px 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 17px 19px; }
  .panel + .panel { margin-top: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }

  /* ---------- scope ---------- */
  .phasetrack { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 18px; }
  .phasebtn { text-align: left; padding: 11px 12px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 7px; display: flex; flex-direction: column; gap: 3px; position: relative; }
  .phasebtn:hover { border-color: var(--accent-line); }
  .phasebtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .phasebtn .pb-bar { height: 3px; border-radius: 2px; background: var(--rule); margin-bottom: 6px; }
  .phasebtn.done .pb-bar { background: var(--st-done); }
  .phasebtn.active .pb-bar { background: linear-gradient(90deg, var(--accent) 0 var(--pct), var(--rule) var(--pct) 100%); }
  .phasebtn .pb-n { font-family: var(--mono); font-size: 10px; letter-spacing: .09em; color: var(--ink-3); text-transform: uppercase; }
  .phasebtn .pb-name { font-size: 14px; font-weight: 500; }
  .phasebtn .pb-date { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .phasebtn .pb-now { position: absolute; top: -8px; right: 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); padding: 1px 6px; border-radius: 99px; }
  .ticklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .ticklist li { display: grid; grid-template-columns: 16px 1fr; gap: 9px; font-size: 13.5px; color: var(--ink-2); }
  .ticklist .mk { font-family: var(--mono); font-size: 12px; line-height: 1.5; }
  .ticklist.yes .mk { color: var(--st-done); }
  .ticklist.no .mk { color: var(--ink-3); }
  .deflist { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13.5px; align-items: baseline; }
  .deflist dt { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .deflist dd { margin: 0; color: var(--ink-2); }

  /* ---------- plan ---------- */
  .vision { font-family: var(--display); font-size: 21px; line-height: 1.45; letter-spacing: -.01em; max-width: 44ch; }
  .priority { margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 20px; }
  .priority-head { display: flex; gap: 14px; align-items: baseline; }
  .pri-n { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--accent); padding-top: 4px; white-space: nowrap; }
  .priority h3 { font-family: var(--display); font-size: 25px; letter-spacing: -.015em; }
  .thesis { color: var(--ink-2); margin-top: 9px; max-width: 66ch; font-size: 14.5px; }
  .kpibox { margin-top: 14px; background: var(--raise); border: 1px solid var(--rule); border-radius: 9px; padding: 13px 16px; }
  .kpi { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--rule-2); }
  .kpi:last-child { border-bottom: 0; }
  .kpi .k-now { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); text-align: right; }
  .kpi .k-tgt { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); text-align: right; white-space: nowrap; }
  .init { margin-top: 13px; background: var(--surface); border: 1px solid var(--rule); border-radius: 9px; padding: 14px 17px; }
  .init-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .init-id { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .init h4 { font-size: 16px; font-weight: 500; }
  .init-detail { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; max-width: 64ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; align-items: center; }
  .chips-label { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 3px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--rule); border-radius: 99px; padding: 2px 9px 2px 6px; font-size: 11.5px; color: var(--ink-2); background: var(--raise); max-width: 100%; }
  .chip:hover { border-color: var(--accent-line); color: var(--ink); background: var(--accent-soft); }
  .chip .ck { font-family: var(--mono); font-size: 9.5px; font-weight: 600; width: 15px; height: 15px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .chip .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 26ch; }
  .chip .cc { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .k-S { background: var(--s-soft); color: var(--s); }
  .k-W { background: var(--w-soft); color: var(--w); }
  .k-O { background: var(--o-soft); color: var(--o); }
  .k-T { background: var(--t-soft); color: var(--t); }
  .track-mile { display: grid; grid-template-columns: 14px 1fr auto; gap: 11px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule-2); font-size: 13.5px; }
  .track-mile:last-child { border-bottom: 0; }

  /* ---------- findings ---------- */
  .filterbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; }
  .filterbar input[type="search"] { font: inherit; font-size: 13.5px; padding: 6px 11px; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface); color: var(--ink); min-width: 200px; flex: 1 1 200px; max-width: 320px; }
  .themelist { display: flex; flex-direction: column; gap: 6px; }
  .themerow { display: grid; grid-template-columns: 20px 1fr 148px 54px; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 13px; }
  .themerow:hover { border-color: var(--accent-line); }
  .themerow .tk { font-family: var(--mono); font-size: 10px; font-weight: 600; width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
  .themerow .tn { font-size: 14px; font-weight: 450; }
  .themerow .tsub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
  .bar { height: 7px; border-radius: 4px; background: var(--rule-2); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .b-survey { background: currentColor; }
  .bar .b-qual { background: currentColor; opacity: .42; }
  .themerow .tc { font-family: var(--mono); font-size: 14px; text-align: right; }
  .themerow .tcl { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); text-align: right; }
  .backbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
  .backbtn:hover { color: var(--accent); }
  .theme-detail h3 { font-family: var(--display); font-size: 24px; letter-spacing: -.015em; margin-top: 4px; max-width: 34ch; }
  .statline { display: flex; gap: 18px; flex-wrap: wrap; margin: 14px 0 16px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stat { display: flex; flex-direction: column; }
  .stat .sv { font-family: var(--mono); font-size: 19px; }
  .stat .sl { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .quote { border-left: 2px solid var(--rule); padding: 3px 0 3px 14px; font-family: var(--display); font-size: 16.5px; line-height: 1.5; color: var(--ink); }
  .quotes { display: flex; flex-direction: column; gap: 13px; margin-top: 12px; }
  .resp { border-top: 1px solid var(--rule-2); padding: 11px 0; }
  .resp .rp { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .resp .rt { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; white-space: pre-wrap; }
  .morebtn { border: 1px solid var(--rule); border-radius: 7px; padding: 7px 13px; font-size: 13px; color: var(--ink-2); background: var(--surface); margin-top: 12px; }
  .morebtn:hover { border-color: var(--accent-line); color: var(--ink); }

  /* ---------- workplan ---------- */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
  .tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 9px; padding: 12px 14px; }
  .tile .tv { font-family: var(--mono); font-size: 25px; line-height: 1.1; }
  .tile .tl { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
  .tile.is-late { border-color: var(--stop); }
  .tile.is-late .tv { color: var(--stop); }
  .progressbig { margin: 15px 0 18px; }
  .pb-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .pb-track { height: 10px; border-radius: 5px; background: var(--rule-2); display: flex; overflow: hidden; gap: 2px; }
  .pb-track i { display: block; height: 100%; }
  .wpbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .initgroup { margin-top: 16px; }
  .initgroup-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 7px; border-bottom: 1px solid var(--rule); }
  .ig-id { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .ig-t { font-size: 15px; font-weight: 500; }
  .ig-p { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .ig-pct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .minitrack { width: 84px; height: 6px; border-radius: 3px; background: var(--rule-2); display: flex; overflow: hidden; gap: 2px; }
  .minitrack i { display: block; height: 100%; }
  .prihead { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 2px; flex-wrap: wrap; }
  .ph-n { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
  .prihead h3 { font-family: var(--display); font-size: 20px; letter-spacing: -.01em; }

  .task { display: grid; grid-template-columns: 18px 22px 64px 1fr 112px 88px; gap: 10px; align-items: center; padding: 8px 6px 8px 4px; border-bottom: 1px solid var(--rule-2); text-align: left; width: 100%; }
  .task:hover { background: var(--raise); }
  .task.sub { padding-left: 30px; background: linear-gradient(90deg, var(--rule-2) 0 2px, transparent 2px); }
  .task.sub .tt { font-size: 13px; color: var(--ink-2); }
  .task .tid { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .task .tt { font-size: 13.8px; }
  .task .town { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .tdue { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); text-align: right; }
  .task.done .tt { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--rule); }
  .task.overdue .tdue { color: var(--stop); font-weight: 500; }
  .tdep { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .twist { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; color: var(--ink-3); font-size: 9px; }
  .twist:hover { background: var(--rule-2); color: var(--ink); }
  .twist[aria-expanded="true"] .tw-ico { transform: rotate(90deg); }
  .tw-ico { display: block; transition: transform .12s ease; }
  .subcount { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-left: 6px; }

  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .dot.next { border: 1.5px solid var(--ink-3); }
  .dot.doing { border: 1.5px solid var(--st-doing); background: linear-gradient(90deg, var(--st-doing) 50%, transparent 50%); }
  .dot.done { background: var(--st-done); }
  .dot.blocked { border: 1.5px solid var(--st-blocked); background: var(--st-blocked); opacity: .32; }
  .dot.late { border: 1.5px solid var(--stop); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--stop) 22%, transparent); }
  .dot.sm { width: 11px; height: 11px; }

  /* ---------- controls ---------- */

<div class="masthead">
  <div class="masthead-in">

</div>

<nav class="tabstrip" id="tabstrip" aria-label="Sections"></nav>

<div class="layout">
  <aside class="rail">
    <nav class="railnav" id="railnav" aria-label="Sections"></nav>
    <div class="railcard">
      <h4 class="eyebrow">Engagement</h4>
      <dl class="deflist" id="railEngagement"></dl>
    </div>
