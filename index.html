      <h4 class="eyebrow">Year one</h4>
      <div id="railProgress"></div>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<div id="overlay"></div>

<script src="data/config.js"></script>
<script src="data/findings.js"></script>
<script src="data/plan.js"></script>
<script>
(function () {
  'use strict';

  var P = window.PORTAL, F = window.FINDINGS, CFG = window.SPP_CONFIG || {};
  var TODAY = P.today;

  var SECTIONS = [
    { id: 'scope', n: '01', title: 'Scope & timeline' },
    { id: 'plan', n: '02', title: 'The plan' },
    { id: 'findings', n: '03', title: 'Findings' },
    { id: 'workplan', n: '04', title: 'Workplan' },
    { id: 'dashboard', n: '05', title: 'Dashboard' }
  ];
  var CATNAME = { S: 'Strengths', W: 'Weaknesses', O: 'Opportunities', T: 'Threats' };
  var STATUS_ORDER = ['next', 'doing', 'done', 'blocked'];
  var STATUS_LABEL = { next: 'Not started', doing: 'In progress', done: 'Done', blocked: 'Blocked' };
  var STATUS_VAR = { done: '--st-done', doing: '--st-doing', next: '--st-next', blocked: '--st-blocked' };
  var STACK = ['done', 'doing', 'blocked', 'next'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  var themeById = {}; F.themes.forEach(function (t) { themeById[t.id] = t; });
  var seedById = {}; P.tasks.forEach(function (t) { seedById[t.id] = t; });
  var initById = {}, initPriority = {};
  P.plan.priorities.forEach(function (p) {
    p.initiatives.forEach(function (o) { initById[o.id] = o; initPriority[o.id] = p; });
  });

  var themeDrives = {};
  P.plan.priorities.forEach(function (p) {
    p.initiatives.forEach(function (o) {
      (o.evidence || []).forEach(function (id) {
        (themeDrives[id] = themeDrives[id] || []).push({ kind: 'init', id: o.id, title: o.title });
      });
    });
  });
  (P.plan.track.evidence || []).forEach(function (id) {
    (themeDrives[id] = themeDrives[id] || []).push({ kind: 'track', id: 'TRK', title: P.plan.track.title });
  });

  var state = {
    section: 'plan',
    sub: { scope: 'timeline', plan: 'all', findings: 'ALL', workplan: 'all', dashboard: 'all' },
    openPhase: 'p5', q: '', openTheme: null, showAllQuotes: false,
    wpFilter: 'all', wpGroup: 'initiative', expanded: {},
    openTask: null, modal: null, dashTable: false,
    role: 'board', user: null, overrides: {}, mode: 'local', saveErr: false
  };

  /* ===================================================================
     STORE — one interface, three backings.
       supabase : the product on Netlify. Real accounts, per-portal roles,
                  RLS in the database, realtime across viewers.
       artifact : this prototype. Shared with everyone who has the link.
       local    : neither reachable; this browser only.
     =================================================================== */
  var Store = (function () {
    var impl = null, listeners = [];
    function emit() { listeners.forEach(function (f) { f(); }); }

    var localBack = {
      name: 'local',
      KEY: 'spp.' + (CFG.portalSlug || 'portal') + '.v2',
      init: function () {
        try {
          var raw = window.localStorage.getItem(this.KEY);
          if (raw) state.overrides = JSON.parse(raw) || {};
        } catch (e) { /* private window or blocked storage: the seed still renders */ }
        return Promise.resolve({ mode: 'local', role: null, user: null });
      },
      save: function (id, row) {
        try { window.localStorage.setItem(this.KEY, JSON.stringify(state.overrides)); } catch (e) {}
        return Promise.resolve();
      }
    };

    var artifactBack = {
      name: 'artifact', db: null,
      init: function () {
        var self = this;
        if (!window.claude || !window.claude.use) return Promise.resolve(null);
        return window.claude.use('db').then(function (db) {
          if (!db) return null;
          self.db = db;
          db.collection('tasks').onSnapshot(function (snap) {
            snap.docs.forEach(function (d) { if (d.exists) state.overrides[d.id] = d.data(); });
            emit();
          }, function () {});
          return { mode: 'artifact', role: null, user: null };
        }).catch(function () { return null; });
      },
      save: function (id, row) {
        localBack.save(id, row);
        return this.db ? this.db.doc('tasks/' + id).set(row) : Promise.resolve();
      }
    };

    function fromRow(row) {
      return {
        status: row.status, owner: row.owner_name, due: row.due_date,
        start: row.start_date, title: row.title, note: row.note || ''
      };
    }

    var supabaseBack = {
      name: 'supabase', sb: null, portalId: null,
      init: function () {
        var self = this;
        if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) return Promise.resolve(null);
        self.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
        return self.sb.auth.getSession().then(function (r) {
          var session = r && r.data && r.data.session;
          if (!session) return { mode: 'supabase', role: null, user: null };
          return self.afterSignIn(session);
        });
      },
      afterSignIn: function (session) {
        var self = this;
        return self.sb.from('portals').select('id').eq('slug', CFG.portalSlug).single()
          .then(function (r) {
            if (r.error || !r.data) throw r.error || new Error('This account cannot reach that portal.');
            self.portalId = r.data.id;
            return self.sb.from('portal_members').select('role')
              .eq('portal_id', self.portalId).eq('user_id', session.user.id).maybeSingle();
          })
          .then(function (r) {
            // RLS has already decided what this account may read and write; the
            // role only shapes the UI. Good Work staff (gw_tenant '*') carry no
            // member row and are treated as owner.
            var claims = session.user.app_metadata || {};
            var role = (r && r.data && r.data.role) || (claims.gw_tenant === '*' ? 'owner' : 'board');
            return self.sb.from('tasks').select('*').eq('portal_id', self.portalId)
              .then(function (t) {
                (t.data || []).forEach(function (row) { state.overrides[row.id] = fromRow(row); });
                self.watch();
                return {
                  mode: 'supabase',
                  role: role,
                  user: { email: session.user.email, id: session.user.id }
                };
              });
          });
      },
      watch: function () {
        var self = this;
        self.sb.channel('tasks-' + self.portalId)
          .on('postgres_changes',
              { event: '*', schema: 'public', table: 'tasks', filter: 'portal_id=eq.' + self.portalId },
              function (payload) {
                var row = payload['new'];
                if (!row || !row.id) return;
                state.overrides[row.id] = fromRow(row);
                emit();
              })
          .subscribe();
      },
      save: function (id, row) {
        var seed = seedById[id] || {};
        return this.sb.from('tasks').upsert({
          portal_id: this.portalId, id: id,
          parent_id: seed.parent || null,
          initiative: seed.obj || '1.1',
          title: row.title, owner_name: row.owner,
          start_date: row.start, due_date: row.due,
          status: row.status, note: row.note || ''
        }, { onConflict: 'portal_id,id' }).then(function (r) { if (r.error) throw r.error; });
      },
      signIn: function (email) { return this.sb.auth.signInWithOtp({ email: email }); },
      verify: function (email, token) {
        var self = this;
        return self.sb.auth.verifyOtp({ email: email, token: token, type: 'email' })
          .then(function (r) {
            if (r.error) throw r.error;
            return self.afterSignIn(r.data.session);
          });
      },
      signOut: function () { return this.sb.auth.signOut(); }
    };

    /* supabase-js is only fetched when a project is actually configured — the
       prototype never configures one, so it never pays for the bundle. */
    function loadSupabase() {
      if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) return Promise.resolve();
      if (window.supabase) return Promise.resolve();
      return new Promise(function (resolve) {
        var el = document.createElement('script');
        el.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js';
        el.onload = function () { resolve(); };
        el.onerror = function () { resolve(); };  // fall through to the next backend
        document.head.appendChild(el);
      });
    }

    return {
      backends: { supabase: supabaseBack, artifact: artifactBack, local: localBack },
      onChange: function (f) { listeners.push(f); },
      init: function () {
        return loadSupabase().then(function () { return supabaseBack.init(); }).then(function (r) {
          if (r) { impl = supabaseBack; return r; }
          return artifactBack.init().then(function (r2) {
            if (r2) { impl = artifactBack; return r2; }
            impl = localBack; return localBack.init();
          });
        }).catch(function () { impl = localBack; return localBack.init(); });
      },
      save: function (id, row) { return (impl || localBack).save(id, row); }
    };
  })();

  /* ---------------- helpers ---------------- */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(d) {
    if (!d) return '—';
    var p = String(d).split('-');
    return +p[2] + ' ' + MON[+p[1] - 1] + ' ' + p[0].slice(2);
  }
  function fmtLong(d) {
    var p = String(d).split('-');
    return +p[2] + ' ' + MONL[+p[1] - 1] + ' ' + p[0];
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function priOf(initId) { return initPriority[initId]; }
  function canEdit() { return state.role === 'staff' || state.role === 'owner'; }

  function taskOf(t) {
    var o = state.overrides[t.id] || {};
    var m = {
      id: t.id, obj: t.obj, dep: t.dep, parent: t.parent || null,
      title: o.title != null ? o.title : t.title,
      owner: o.owner != null ? o.owner : t.owner,
      start: o.start != null ? o.start : t.start,
      due: o.due != null ? o.due : t.due,
      status: o.status != null ? o.status : (t.status === 'late' ? 'next' : t.status),
      note: o.note != null ? o.note : ''
    };
    m.overdue = m.status !== 'done' && m.due < TODAY;
    return m;
  }
  function allRows() { return P.tasks.map(taskOf); }
  function topTasks() { return allRows().filter(function (t) { return !t.parent; }); }
  function subsOf(id) { return allRows().filter(function (t) { return t.parent === id; }); }

  /* One scope governs §2, §4 and §5: the whole plan, or a single strategic
     priority. This is the only place that decides what is in view. */
  function inScope(t) {
    var s = state.sub[state.section];
    if (!s || s === 'all') return true;
    var p = priOf(t.obj);
    return !!p && p.id === s;
  }
  function scopedTop() { return topTasks().filter(inScope); }
  function scopedPriorities() {
    var s = state.sub[state.section];
    return (!s || s === 'all') ? P.plan.priorities
      : P.plan.priorities.filter(function (p) { return p.id === s; });
  }
  function counts(rows) {
    var c = { total: rows.length, done: 0, doing: 0, next: 0, blocked: 0, late: 0 };
    rows.forEach(function (t) { c[t.status]++; if (t.overdue) c.late++; });
    return c;
  }
  function segs(c, total) {
    return STACK.map(function (k) {
      var w = pct(c[k], total);
      return w ? '<i style="width:' + w + '%;background:var(' + STATUS_VAR[k] + ')"></i>' : '';
    }).join('');
  }
  function catChip(id) {
    var t = themeById[id];
    if (!t) return '';
    return '<button class="chip" data-goto-theme="' + t.id + '">' +
      '<span class="ck k-' + t.cat + '">' + t.cat + '</span>' +
      '<span class="cn">' + esc(t.name) + '</span>' +
      '<span class="cc num">' + t.n + '</span></button>';
  }
  function evidenceRow(ids, label) {
    if (!ids || !ids.length) return '';
    return '<div class="chips"><span class="chips-label">' + (label || 'Evidence') + '</span>' + ids.map(catChip).join('') + '</div>';
  }
  function head(eyebrow, title, sub) {
    return '<div class="shead"><span class="eyebrow">' + esc(eyebrow) + '</span><h2>' + esc(title) + '</h2>' +
      (sub ? '<p>' + sub + '</p>' : '') + '</div>';
  }

  /* ---------------- chrome ---------------- */

  function renderMast() {
    var syncText = state.saveErr ? 'not saved'
      : state.mode === 'supabase' ? (state.user ? 'supabase · live' : 'supabase · signed out')
      : state.mode === 'artifact' ? 'shared · live' : 'this browser only';
    var live = !state.saveErr && state.mode !== 'local' && !(state.mode === 'supabase' && !state.user);

    var who;
    if (state.mode === 'supabase' && state.user) {
      who = '<span class="whoami"><span class="avatar">' + esc((state.user.email || '?').slice(0, 2).toUpperCase()) + '</span>' +
        '<span>' + esc(state.user.email) + '</span></span><button class="ghost" id="signOut">Sign out</button>';
    } else if (state.mode === 'supabase') {
      who = '<button class="solid" id="signIn">Sign in</button>';
    } else {
      /* No account system is reachable on this view, so the switch is a preview
         of what each account type sees — labelled as exactly that. */
      who = '<span class="eyebrow">Preview as</span>' +
        '<div class="seg" role="group" aria-label="Preview role">' +
        '<button id="roleBoard" aria-pressed="' + (state.role === 'board') + '">Board</button>' +
        '<button id="roleStaff" aria-pressed="' + (state.role === 'staff') + '">Staff</button></div>';
    }
    document.getElementById('mastRight').innerHTML =
      '<span class="syncpill' + (live ? ' live' : '') + '" id="syncPill">' + syncText + '</span>' + who;
  }

  function renderNav() {
    var c = counts(topTasks());
    document.getElementById('railnav').innerHTML = SECTIONS.map(function (s) {
      return '<button data-sec="' + s.id + '" aria-current="' + (state.section === s.id) + '">' +
        '<span class="rn-n">' + s.n + '</span><span class="rn-t">' + s.title + '</span>' +
        '<span class="rn-c">' + (s.id === 'workplan' ? c.done + '/' + c.total : '') + '</span></button>';
    }).join('');
    document.getElementById('tabstrip').innerHTML = SECTIONS.map(function (s) {
      return '<button data-sec="' + s.id + '" aria-current="' + (state.section === s.id) + '">' + s.title + '</button>';
    }).join('');

    var active = P.phases.filter(function (p) { return p.status === 'active'; })[0] || P.phases[P.phases.length - 1];
    document.getElementById('railEngagement').innerHTML =
      '<dt>Firm</dt><dd>' + esc(P.firm.name) + '</dd>' +
      '<dt>Lead</dt><dd>' + esc(P.firm.lead) + '</dd>' +
      '<dt>Adopted</dt><dd class="num">' + fmt(P.client.adopted) + '</dd>' +
      '<dt>Phase</dt><dd>' + active.n + ' · ' + esc(active.name) + '</dd>' +
      '<dt>Today</dt><dd class="num">' + fmt(TODAY) + '</dd>';
    document.getElementById('railProgress').innerHTML =
      '<div class="pb-row"><span class="num" style="font-family:var(--mono);font-size:19px">' + pct(c.done, c.total) + '%</span>' +
      '<span class="eyebrow">' + c.done + ' of ' + c.total + ' done</span></div>' +
      '<div class="pb-track">' + segs(c, c.total) + '</div>' +
      (c.late ? '<div style="margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--stop)">' + c.late + ' past due</div>' : '');
  }

  /* Layer two: a scope picker for the sections that carry one, sub-views for
     the rest. Export lives here because what you export is what is in scope. */
  function renderSubnav() {
    var s = state.section, cur = state.sub[s], out = '';
    function b(v, label, count) {
      return '<button data-sub="' + v + '" aria-current="' + (cur === v) + '">' + label +
        (count != null ? ' <span class="num" style="font-family:var(--mono);font-size:10.5px;color:var(--ink-3)">' + count + '</span>' : '') + '</button>';
    }
    if (s === 'scope') {
      out = b('timeline', 'Timeline') + b('agreement', 'Scope &amp; cadence') + b('team', 'Who is on it');
    } else if (s === 'findings') {
      var by = { ALL: F.themes.length, S: 0, W: 0, O: 0, T: 0 };
      F.themes.forEach(function (t) { by[t.cat]++; });
      out = b('ALL', 'All themes', by.ALL) + '<span class="sn-sep"></span>' +
        ['S', 'W', 'O', 'T'].map(function (k) { return b(k, CATNAME[k], by[k]); }).join('');
    } else {
      var rows = topTasks(), showN = s !== 'plan';
      out = b('all', 'Whole plan', showN ? rows.length : null) + '<span class="sn-sep"></span>' +
        P.plan.priorities.map(function (p) {
          var n = rows.filter(function (t) { return priOf(t.obj) === p; }).length;
          return b(p.id, 'Priority ' + p.n, showN ? n : null);
        }).join('');
    }
    if (s === 'plan' || s === 'workplan' || s === 'dashboard') {
      out += '<span class="sn-spacer"></span><button class="ghost" id="exportBtn">Export ▾</button>';
    }
    document.getElementById('subnav').innerHTML = out;
  }

  /* ---------------- 01 · scope ---------------- */

  function renderScope() {
    var view = state.sub.scope, s = P.scope;

    if (view === 'agreement') {
      return head('01 · Scope &amp; timeline', 'What we agreed to do',
          'The boundary matters as much as the list — half of these conversations are about what the engagement is not.') +
        '<div class="grid2">' +
          '<div class="panel"><h4 class="eyebrow" style="margin-bottom:11px">In scope</h4><ul class="ticklist yes">' +
            s.inScope.map(function (x) { return '<li><span class="mk">✓</span><span>' + esc(x) + '</span></li>'; }).join('') + '</ul></div>' +
          '<div class="panel"><h4 class="eyebrow" style="margin-bottom:11px">Out of scope</h4><ul class="ticklist no">' +
            s.outOfScope.map(function (x) { return '<li><span class="mk">—</span><span>' + esc(x) + '</span></li>'; }).join('') + '</ul></div>' +
        '</div><div class="panel" style="margin-top:13px"><h4 class="eyebrow" style="margin-bottom:11px">Working cadence</h4><div class="deflist">' +
          s.cadence.map(function (c) {
            return '<dt>' + fmt(c.next) + '</dt><dd><strong style="font-weight:500;color:var(--ink)">' + esc(c.label) + '</strong><br>' + esc(c.detail) + '</dd>';
          }).join('') + '</div></div>';
    }

    if (view === 'team') {
      return head('01 · Scope &amp; timeline', 'Who is on it',
          'Four named parties, plus everyone carrying tasks in §4. The search committee runs its own track.') +
        '<div class="panel"><h4 class="eyebrow" style="margin-bottom:11px">Engagement</h4><div class="deflist">' +
          s.team.map(function (m) {
            return '<dt>' + esc(m.org === P.firm.name ? 'Good Work' : 'Client') + '</dt>' +
              '<dd><strong style="font-weight:500;color:var(--ink)">' + esc(m.name) + '</strong> · ' + esc(m.role) + '</dd>';
          }).join('') + '</div></div>' +
        '<div class="panel"><h4 class="eyebrow" style="margin-bottom:11px">Task owners in the workplan</h4><div class="deflist">' +
          ownerLoad(topTasks()).map(function (o) {
            return '<dt>' + o.open + ' open</dt><dd><strong style="font-weight:500;color:var(--ink)">' + esc(o.name) + '</strong>' +
              (o.late ? ' · <span style="color:var(--stop)">' + o.late + ' past due</span>' : '') + '</dd>';
          }).join('') + '</div></div>';
    }

    var phase = P.phases.filter(function (p) { return p.id === state.openPhase; })[0];
    var rail = P.phases.map(function (p) {
      var cls = p.status === 'done' ? 'done' : (p.status === 'active' ? 'active' : '');
      var style = '';
      if (p.status === 'active') {
        var a = Date.parse(p.start), b2 = Date.parse(p.end), n = Date.parse(TODAY);
        style = ' style="--pct:' + Math.max(0, Math.min(100, Math.round(((n - a) / (b2 - a)) * 100))) + '%"';
      }
      return '<button class="phasebtn ' + cls + '"' + style + ' data-phase="' + p.id + '" aria-pressed="' + (state.openPhase === p.id) + '">' +
        (p.status === 'active' ? '<span class="pb-now">You are here</span>' : '') +
        '<span class="pb-bar"></span><span class="pb-n">Phase ' + p.n + '</span>' +
        '<span class="pb-name">' + esc(p.name) + '</span>' +
        '<span class="pb-date num">' + fmt(p.start) + ' – ' + fmt(p.end) + '</span></button>';
    }).join('');

    return head('01 · Scope &amp; timeline', 'Where the engagement stands',
        'Five phases from February 2026 through August 2027. Four are complete; implementation runs for another eleven months.') +
      '<div class="phasetrack">' + rail + '</div>' +
      '<div class="panel"><span class="eyebrow">Phase ' + phase.n + ' · ' + esc(phase.name) + ' · ' + fmt(phase.start) + ' – ' + fmt(phase.end) + '</span>' +
        '<p style="font-family:var(--display);font-size:18px;line-height:1.45;margin-top:7px;max-width:52ch">' + esc(phase.blurb) + '</p>' +
        '<div class="grid2" style="margin-top:15px">' +
          '<div><h4 class="eyebrow" style="margin-bottom:9px">Deliverables</h4><ul class="ticklist ' + (phase.status === 'done' ? 'yes' : 'no') + '">' +
            phase.deliverables.map(function (d) {
              return '<li><span class="mk">' + (phase.status === 'done' ? '✓' : '·') + '</span><span>' + esc(d) + '</span></li>';
            }).join('') + '</ul></div>' +
          '<div><h4 class="eyebrow" style="margin-bottom:9px">Note</h4><p style="font-size:13.5px;color:var(--ink-2)">' + esc(phase.note) + '</p></div>' +
        '</div></div>';
  }

  /* ---------------- 02 · plan ---------------- */

  function renderPlan() {
    var list = scopedPriorities(), scoped = state.sub.plan !== 'all';

    var body = list.map(function (p) {
      var inits = p.initiatives.map(function (o) {
        var ts = topTasks().filter(function (t) { return t.obj === o.id; });
        var doneN = ts.filter(function (t) { return t.status === 'done'; }).length;
        return '<div class="init" id="init-' + o.id + '">' +
          '<div class="init-head"><span class="init-id">' + o.id + '</span><h4>' + esc(o.title) + '</h4></div>' +
          '<p class="init-detail">' + esc(o.detail) + '</p>' + evidenceRow(o.evidence) +
          '<div class="chips noprint"><span class="chips-label">Workplan</span>' +
          '<button class="chip" data-goto-tasks="' + o.id + '"><span class="cn">' + doneN + ' of ' + ts.length + ' tasks done</span></button></div></div>';
      }).join('');

      return '<section class="priority">' +
        '<div class="priority-head"><span class="pri-n">Priority ' + p.n + '</span>' +
        '<div style="flex:1 1 auto;min-width:0"><h3>' + esc(p.title) + '</h3>' +
        '<p class="thesis">' + esc(p.thesis) + '</p>' + evidenceRow(p.evidence, 'Drawn from') + '</div></div>' +
        '<div class="kpibox"><h4 class="eyebrow" style="margin-bottom:7px">KPIs · how we will know</h4>' +
          p.kpis.map(function (k) {
            return '<div class="kpi"><span>' + esc(k.text) + ' <span class="init-id">' + k.init + '</span></span>' +
              '<span class="k-now num">' + esc(k.now) + '</span><span class="k-tgt num">→ ' + esc(k.target) + '</span></div>';
          }).join('') + '</div>' + inits + '</section>';
    }).join('');

    var track = scoped ? '' :
      '<section class="priority"><div class="priority-head"><span class="pri-n">Track</span>' +
      '<div style="flex:1 1 auto;min-width:0"><h3>' + esc(P.plan.track.title) + '</h3>' +
      '<p class="thesis">' + esc(P.plan.track.note) + '</p>' + evidenceRow(P.plan.track.evidence, 'Drawn from') + '</div></div>' +
      '<div class="init">' + P.plan.track.milestones.map(function (m) {
        return '<div class="track-mile"><span class="dot ' + m.status + '"></span><span>' + esc(m.label) + '</span>' +
          '<span class="num" style="font-family:var(--mono);font-size:11.5px;color:var(--ink-3)">' + fmt(m.date) + '</span></div>';
      }).join('') + '</div></section>';

    return head('02 · The plan',
        scoped ? 'Priority ' + list[0].n + ' · ' + list[0].title : P.client.name + ' · ' + P.client.engagement,
        scoped ? 'One strategic priority, its KPIs, and the initiatives beneath it.'
               : 'Adopted ' + fmtLong(P.client.adopted) + '. ' + esc(P.plan.framing)) +
      (scoped ? '' : '<div class="panel" style="border-left:2px solid var(--accent)">' +
        '<h4 class="eyebrow" style="margin-bottom:9px">Where this is going</h4>' +
        '<p class="vision">' + esc(P.plan.vision) + '</p></div>') +
      '<div class="callout noprint" style="margin-top:16px"><span aria-hidden="true">↗</span>' +
        '<span>Every chip opens the finding it came from — counts are live from the ' + F.meta.total_sources +
        ' sources in §3. <strong style="font-weight:500;color:var(--ink)">Export</strong> writes ' +
        (scoped ? 'this priority' : 'the whole plan') + ' to PDF, CSV or JSON.</span></div>' +
      body + track;
  }

  /* ---------------- 03 · findings ---------------- */

  function filteredThemes() {
    var q = state.q.trim().toLowerCase(), cat = state.sub.findings;
    return F.themes.filter(function (t) {
      if (cat !== 'ALL' && t.cat !== cat) return false;
      if (!q) return true;
      if (t.name.toLowerCase().indexOf(q) >= 0 || t.summary.toLowerCase().indexOf(q) >= 0) return true;
      return t.more.some(function (i) { return F.quotes[i][1].toLowerCase().indexOf(q) >= 0; });
    }).sort(function (a, b) { return b.n - a.n; });
  }

  function renderFindings() {
    if (state.openTheme) return renderTheme(themeById[state.openTheme]);
    var list = filteredThemes();
    var rows = list.map(function (t) {
      var w = Math.round((t.n / t.max) * 100);
      var drives = themeDrives[t.id];
      return '<button class="themerow" data-theme="' + t.id + '" style="color:var(--' + t.cat.toLowerCase() + ')">' +
        '<span class="tk k-' + t.cat + '">' + t.cat + '</span>' +
        '<span style="color:var(--ink);min-width:0"><span class="tn">' + esc(t.name) + '</span>' +
        '<span class="tsub">' + (t.interview ? 'survey + interviews' : 'survey only') +
        (drives ? ' · drives ' + drives.length + ' initiative' + (drives.length > 1 ? 's' : '') : '') + '</span></span>' +
        '<span class="bar" style="width:' + Math.max(w, 3) + '%"><i class="b-survey" style="width:' + pct(t.nSurvey, t.n) + '%"></i>' +
        '<i class="b-qual" style="width:' + pct(t.nQual, t.n) + '%"></i></span>' +
        '<span><span class="tc num" style="color:var(--ink)">' + t.n + '</span><span class="tcl">sources</span></span></button>';
    }).join('');

    return head('03 · Findings', 'What ' + F.meta.total_sources + ' sources actually said',
        F.meta.total_survey + ' survey responses and ' + F.meta.qual_breakdown + ', coded into ' + F.themes.length +
        ' themes. The number on each row is how many separate sources raised it.') +
      '<div class="filterbar"><input type="search" id="themeSearch" placeholder="Search themes and responses…" value="' + esc(state.q) + '" /></div>' +
      (list.length ? '<div class="themelist">' + rows + '</div>'
        : '<div class="panel"><p style="color:var(--ink-2)">No themes match “' + esc(state.q) + '”.</p></div>');
  }

  function renderTheme(t) {
    var drives = themeDrives[t.id] || [];
    var shown = state.showAllQuotes ? t.more : t.more.slice(0, 6);
    return '<button class="backbtn" id="backThemes">← All themes</button>' +
      '<div class="theme-detail" style="color:var(--' + t.cat.toLowerCase() + ')">' +
        '<span class="eyebrow" style="color:var(--' + t.cat.toLowerCase() + ')">' + CATNAME[t.cat] + ' · rank ' + t.rank +
        ' of ' + F.themes.filter(function (x) { return x.cat === t.cat; }).length + '</span>' +
        '<h3 style="color:var(--ink)">' + esc(t.name) + '</h3>' +
        '<div class="statline">' +
          '<span class="stat"><span class="sv" style="color:var(--' + t.cat.toLowerCase() + ')">' + t.n + '</span><span class="sl">of ' + t.max + ' sources</span></span>' +
          '<span class="stat"><span class="sv" style="color:var(--ink)">' + t.nSurvey + '</span><span class="sl">survey</span></span>' +
          '<span class="stat"><span class="sv" style="color:var(--ink)">' + t.nQual + '</span><span class="sl">of ' + t.maxQual + ' interviews</span></span>' +
        '</div><p style="color:var(--ink-2);max-width:66ch;font-size:14.5px">' + esc(t.summary) + '</p>' +
        (drives.length ? '<div class="chips noprint"><span class="chips-label">Drives</span>' +
          drives.map(function (d) {
            return '<button class="chip" data-goto-init="' + (d.kind === 'init' ? d.id : '') + '">' +
              '<span class="ck" style="background:var(--accent-soft);color:var(--accent)">' + (d.kind === 'init' ? d.id : '↗') + '</span>' +
              '<span class="cn">' + esc(d.title) + '</span></button>';
          }).join('') + '</div>' : '') +
        (t.pull.length ? '<h4 class="eyebrow" style="margin:22px 0 0">In their words</h4><div class="quotes">' +
          t.pull.map(function (q) { return '<blockquote class="quote">“' + esc(q) + '”</blockquote>'; }).join('') + '</div>' : '') +
        (t.more.length ? '<h4 class="eyebrow" style="margin:24px 0 2px">Survey responses coded to this theme · ' + t.moreTotal + '</h4><div>' +
          shown.map(function (i) {
            return '<div class="resp"><div class="rp">' + esc(F.quotes[i][0]) + '</div><div class="rt">' + esc(F.quotes[i][1]) + '</div></div>';
          }).join('') + '</div>' +
          (t.more.length > 6 ? '<button class="morebtn" id="moreQuotes">' +
            (state.showAllQuotes ? 'Show fewer' : 'Show all ' + t.more.length + ' responses') + '</button>' : '') : '') +
      '</div>';
  }

  /* ---------------- 04 · workplan ---------------- */

  function wpVisible() {
    var ts = scopedTop();
    if (state.wpFilter === 'late') return ts.filter(function (t) { return t.overdue; });
    if (state.wpFilter === 'open') return ts.filter(function (t) { return t.status !== 'done'; });
    if (state.wpFilter === 'quarter') return ts.filter(function (t) { return t.due >= '2026-09-01' && t.due <= '2026-11-30'; });
    return ts;
  }

  function taskRow(t, isSub) {
    var subs = isSub ? [] : subsOf(t.id);
    var open = !!state.expanded[t.id];
    var dotCls = t.overdue ? 'late' : t.status;
    var doneSubs = subs.filter(function (s) { return s.status === 'done'; }).length;
    return '<div class="task ' + t.status + (t.overdue ? ' overdue' : '') + (isSub ? ' sub' : '') + '">' +
      (subs.length ? '<button class="twist" data-twist="' + t.id + '" aria-expanded="' + open + '" aria-label="' +
        (open ? 'Collapse' : 'Expand') + ' subtasks of ' + esc(t.title) + '"><span class="tw-ico">▶</span></button>' : '<span></span>') +
      '<button class="statusbtn" data-cycle="' + t.id + '"' + (canEdit() ? '' : ' disabled') +
        ' title="' + STATUS_LABEL[t.status] + '" aria-label="' + STATUS_LABEL[t.status] + (canEdit() ? ' — click to advance' : '') + '">' +
        '<span class="dot ' + (isSub ? 'sm ' : '') + dotCls + '"></span></button>' +
      '<span class="tid">' + t.id + '</span>' +
      '<button class="tt" data-task="' + t.id + '" style="text-align:left">' + esc(t.title) +
        (t.dep ? ' <span class="tdep">· after ' + t.dep + '</span>' : '') +
        (subs.length ? '<span class="subcount num">' + doneSubs + '/' + subs.length + '</span>' : '') + '</button>' +
      '<span class="town">' + esc(t.owner) + '</span>' +
      '<span class="tdue num">' + fmt(t.due) + '</span></div>' +
      (open ? subs.map(function (s) { return taskRow(s, true); }).join('') : '');
  }

  function renderWorkplan() {
    var scoped = scopedTop(), c = counts(scoped), vis = wpVisible(), groups = '';
    var subCount = allRows().filter(function (t) { return t.parent && inScope(t); }).length;

    if (state.wpGroup === 'initiative') {
      scopedPriorities().forEach(function (p) {
        var any = p.initiatives.some(function (o) { return vis.some(function (t) { return t.obj === o.id; }); });
        if (!any) return;
        if (state.sub.workplan === 'all') {
          groups += '<div class="prihead"><span class="ph-n">Priority ' + p.n + '</span><h3>' + esc(p.title) + '</h3></div>';
        }
        p.initiatives.forEach(function (o) {
          var ts = vis.filter(function (t) { return t.obj === o.id; });
          if (!ts.length) return;
          var all = topTasks().filter(function (t) { return t.obj === o.id; });
          var ic = counts(all);
          groups += '<div class="initgroup"><div class="initgroup-head"><span class="ig-id">' + o.id + '</span>' +
            '<span class="ig-t">' + esc(o.title) + '</span><span class="ig-p"><span class="minitrack">' + segs(ic, all.length) + '</span>' +
            '<span class="ig-pct num">' + ic.done + '/' + all.length + '</span></span></div>' +
            ts.map(function (t) { return taskRow(t, false); }).join('') + '</div>';
        });
      });
    } else {
      ownerLoad(vis).forEach(function (o) {
        var ts = vis.filter(function (t) { return t.owner === o.name; });
        groups += '<div class="initgroup"><div class="initgroup-head"><span class="ig-t">' + esc(o.name) + '</span>' +
          (o.late ? '<span class="ig-id" style="color:var(--stop)">' + o.late + ' past due</span>' : '') +
          '<span class="ig-p"><span class="minitrack">' + segs(o, o.total) + '</span>' +
          '<span class="ig-pct num">' + o.done + '/' + o.total + '</span></span></div>' +
          ts.map(function (t) { return taskRow(t, false); }).join('') + '</div>';
      });
    }

    var filters = [['all', 'All ' + c.total], ['open', 'Open ' + (c.total - c.done)],
                   ['late', 'Past due ' + c.late], ['quarter', 'This quarter']]
      .map(function (f) { return '<button class="ghost" data-wpf="' + f[0] + '" aria-pressed="' + (state.wpFilter === f[0]) + '">' + f[1] + '</button>'; }).join('');

    var sub = state.sub.workplan;
    var pri = sub === 'all' ? null : P.plan.priorities.filter(function (p) { return p.id === sub; })[0];

    return head('04 · Workplan',
        pri ? 'Priority ' + pri.n + ' · ' + pri.title : 'Year one · ' + fmt('2026-08-24') + ' to ' + fmt('2027-08-20'),
        c.total + ' tasks and ' + subCount + ' subtasks, each under an initiative in §2. ' +
        (canEdit() ? 'Click a status dot to advance it, or open a task for owner, date, subtasks and notes.'
          : 'This view is read-only. ' + (state.mode === 'supabase' ? 'Sign in with a staff account to make changes.' : 'Switch the preview to Staff to make changes.'))) +
      '<div class="tiles">' +
        '<div class="tile"><div class="tv num" style="color:var(--st-done)">' + c.done + '</div><div class="tl">Done</div></div>' +
        '<div class="tile"><div class="tv num" style="color:var(--st-doing)">' + c.doing + '</div><div class="tl">In progress</div></div>' +
        '<div class="tile' + (c.late ? ' is-late' : '') + '"><div class="tv num">' + c.late + '</div><div class="tl">Past due</div></div>' +
        '<div class="tile"><div class="tv num" style="color:var(--ink-3)">' + (c.next + c.blocked) + '</div><div class="tl">Not started</div></div></div>' +
      '<div class="progressbig"><div class="pb-row"><span class="eyebrow">Completion</span>' +
        '<span class="num" style="font-family:var(--mono);font-size:13px;color:var(--ink-2)">' + pct(c.done, c.total) + '% · ' + c.done + ' of ' + c.total + '</span></div>' +
        '<div class="pb-track">' + segs(c, c.total) + '</div></div>' +
      '<div class="wpbar">' + filters + '<span style="flex:1 1 auto"></span><span class="eyebrow">Group by</span>' +
        '<button class="ghost" data-wpg="initiative" aria-pressed="' + (state.wpGroup === 'initiative') + '">Initiative</button>' +
        '<button class="ghost" data-wpg="owner" aria-pressed="' + (state.wpGroup === 'owner') + '">Owner</button></div>' +
      (groups || '<div class="panel"><p style="color:var(--ink-2)">Nothing matches this filter.</p></div>') +
      '<div class="legend">' + STACK.map(function (k) {
        return '<span><i class="dot ' + k + '"></i> ' + STATUS_LABEL[k] + '</span>';
      }).join('') + '<span><i class="dot late"></i> Past due</span></div>';
  }

  /* ---------------- 05 · dashboard ---------------- */

  function ownerLoad(rows) {
    var by = {};
    rows.forEach(function (t) {
      var o = by[t.owner] = by[t.owner] ||
        { name: t.owner, total: 0, done: 0, doing: 0, next: 0, blocked: 0, late: 0, open: 0 };
      o.total++; o[t.status]++;
      if (t.overdue) o.late++;
      if (t.status !== 'done') o.open++;
    });
    return Object.keys(by).map(function (k) { return by[k]; })
      .sort(function (a, b) { return b.late - a.late || b.open - a.open || a.name.localeCompare(b.name); });
  }

  function monthBuckets(rows) {
    var by = {};
    rows.forEach(function (t) {
      if (!t.due) return;
      var k = t.due.slice(0, 7);
      var m = by[k] = by[k] || { key: k, total: 0, done: 0, doing: 0, next: 0, blocked: 0 };
      m.total++; m[t.status]++;
    });
    return Object.keys(by).sort().map(function (k) { return by[k]; });
  }

  function statusLegend() {
    return '<div class="clegend">' + STACK.map(function (k) {
      return '<span><i class="swatch" style="background:var(' + STATUS_VAR[k] + ')"></i>' + STATUS_LABEL[k] + '</span>';
    }).join('') + '</div>';
  }

  /* Horizontal stacked bars. A direct label ends every row, a legend sits
     beneath, and 2px gaps separate the segments — the relief the recessive
     neutral needs to stay readable. */
  function hbars(rows, max) {
    return rows.map(function (r) {
      return '<div class="hrow"><span class="hl" title="' + esc(r.name) + '">' + esc(r.name) +
        (r.late ? ' <span style="color:var(--stop)" title="' + r.late + ' past due">•</span>' : '') + '</span>' +
        '<span class="hbar" style="width:' + Math.max(pct(r.total, max), 5) + '%">' +
        STACK.map(function (k) {
          return r[k] ? '<i style="width:' + pct(r[k], r.total) + '%;background:var(' + STATUS_VAR[k] + ')" title="' +
            STATUS_LABEL[k] + ': ' + r[k] + '"></i>' : '';
        }).join('') + '</span><span class="hv num">' + r.done + '/' + r.total + '</span></div>';
    }).join('');
  }

  /* Tasks due per month, stacked by status, with this month marked. Only data
     the workplan actually holds: a seeded plan has no completion timestamps,
     so there is no burn-up line that could be drawn honestly. */
  function dueChart(rows) {
    var ms = monthBuckets(rows);
    if (!ms.length) return '<p style="color:var(--ink-2);font-size:13px">No dated tasks in scope.</p>';
    var W = 660, H = 196, padL = 32, padB = 40, padT = 10;
    var max = Math.max.apply(null, ms.map(function (m) { return m.total; }));
    var plotH = H - padB - padT;
    var step = (W - padL - 10) / ms.length, bw = Math.min(step - 9, 38);

    var ticks = [];
    [0, Math.round(max / 2), max].forEach(function (v) { if (ticks.indexOf(v) < 0) ticks.push(v); });
    var grid = ticks.map(function (v) {
      var y = padT + plotH - (v / max) * plotH;
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - 6) + '" y2="' + y + '" stroke="var(--rule-2)" stroke-width="1" />' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="var(--ink-3)">' + v + '</text>';
    }).join('');

    var now = TODAY.slice(0, 7), shade = '', bars = '';
    ms.forEach(function (m, i) {
      var x = padL + i * step + (step - bw) / 2, y = padT + plotH;
      if (m.key === now) {
        shade = '<rect x="' + (x - 5) + '" y="' + padT + '" width="' + (bw + 10) + '" height="' + plotH +
          '" fill="var(--accent)" opacity="0.08" rx="3" />';
      }
      STACK.forEach(function (k) {
        if (!m[k]) return;
        var h = (m[k] / max) * plotH - 2;
        if (h < 1.5) h = 1.5;
        y -= h;
        bars += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="2" fill="var(' + STATUS_VAR[k] + ')">' +
          '<title>' + MONL[+m.key.slice(5) - 1] + ' ' + m.key.slice(0, 4) + ' · ' + STATUS_LABEL[k] + ': ' + m[k] + '</title></rect>';
        y -= 2;
      });
      bars += '<text x="' + (x + bw / 2) + '" y="' + (padT + plotH + 15) + '" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="' +
        (m.key === now ? 'var(--ink)' : 'var(--ink-3)') + '">' + MON[+m.key.slice(5) - 1] + '</text>';
      if (i === 0 || m.key.slice(5) === '01') {
        bars += '<text x="' + (x + bw / 2) + '" y="' + (padT + plotH + 28) + '" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="var(--ink-3)">' +
          m.key.slice(0, 4) + '</text>';
      }
    });

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" ' +
      'aria-label="Tasks due per month, stacked by status. This month is shaded.">' +
      shade + grid + bars +
      '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (W - 6) + '" y2="' + (padT + plotH) + '" stroke="var(--rule)" stroke-width="1" /></svg>';
  }

  function renderDashboard() {
    var scoped = scopedTop(), c = counts(scoped), pris = scopedPriorities();
    var priRows = pris.map(function (p) {
      var ts = topTasks().filter(function (t) { return priOf(t.obj) === p; });
      var pc = counts(ts);
      pc.name = 'P' + p.n + ' · ' + p.title;
      return pc;
    });
    var maxPri = Math.max.apply(null, priRows.map(function (r) { return r.total; }).concat([1]));
    var owners = ownerLoad(scoped);
    var maxOwn = Math.max.apply(null, owners.map(function (r) { return r.total; }).concat([1]));
    var subs = allRows().filter(function (t) { return t.parent && inScope(t); });
    var subDone = subs.filter(function (t) { return t.status === 'done'; }).length;
    var kpis = pris.reduce(function (a, p) { return a.concat(p.kpis); }, []);
    var soon = scoped.filter(function (t) { return t.status !== 'done' && t.due >= TODAY && t.due <= '2026-12-15'; }).length;

    var table = '<div class="tablewrap"><table class="dtable">' +
      '<caption class="sr">Task counts by strategic priority</caption><thead><tr><th>Strategic priority</th>' +
      STACK.map(function (k) { return '<th>' + STATUS_LABEL[k] + '</th>'; }).join('') + '<th>Past due</th></tr></thead><tbody>' +
      priRows.map(function (r) {
        return '<tr><td>' + esc(r.name) + '</td>' + STACK.map(function (k) { return '<td class="n">' + r[k] + '</td>'; }).join('') +
          '<td class="n">' + r.late + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    return head('05 · Dashboard',
        state.sub.dashboard === 'all' ? 'Where the year actually stands' : 'Priority ' + pris[0].n + ' · ' + pris[0].title,
        'Read this before the quarterly review. Everything here obeys the scope picker above.') +
      '<div class="tiles">' +
        '<div class="tile"><div class="tv num">' + pct(c.done, c.total) + '%</div><div class="tl">Year one complete</div></div>' +
        '<div class="tile' + (c.late ? ' is-late' : '') + '"><div class="tv num">' + c.late + '</div><div class="tl">Past due</div></div>' +
        '<div class="tile"><div class="tv num">' + soon + '</div><div class="tl">Due before 15 Dec</div></div>' +
        '<div class="tile"><div class="tv num">' + subDone + '/' + subs.length + '</div><div class="tl">Subtasks done</div></div></div>' +

      '<div class="charts" style="margin-top:13px">' +
        '<div class="chart wide"><h4>Tasks due per month</h4>' +
          '<p class="csub">Where the year is overloaded. The shaded column is this month.</p>' +
          '<div class="chartbody">' + dueChart(scoped) + '</div>' + statusLegend() + '</div>' +

        '<div class="chart"><h4>Completion by strategic priority</h4>' +
          '<p class="csub">Bar length is how many tasks the priority carries.</p>' +
          '<div class="chartbody" style="margin-top:9px">' + hbars(priRows, maxPri) + '</div>' + statusLegend() +
          '<button class="ghost" id="dashTableBtn" style="margin-top:11px">' + (state.dashTable ? 'Hide table' : 'Show as table') + '</button>' +
          (state.dashTable ? table : '') + '</div>' +

        '<div class="chart"><h4>Load by owner</h4>' +
          '<p class="csub">Sorted by what is past due, then what is still open.</p>' +
          '<div class="chartbody" style="margin-top:9px">' + hbars(owners, maxOwn) + '</div>' + statusLegend() +
          '<p class="savenote">• marks an owner with something past due.</p></div>' +

        '<div class="chart wide"><h4>KPIs · ' + kpis.length + ' in scope</h4>' +
          '<p class="csub">The plan’s own measures. They move quarterly, not weekly — read here, edited in §2.</p>' +
          '<div class="tablewrap"><table class="dtable"><thead><tr><th>Measure</th><th>Initiative</th><th>Now</th><th>Target</th></tr></thead><tbody>' +
          kpis.map(function (k) {
            return '<tr><td>' + esc(k.text) + '</td><td class="num" style="color:var(--ink-3)">' + k.init +
              '</td><td class="num">' + esc(k.now) + '</td><td class="num" style="color:var(--ink-3)">' + esc(k.target) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>' +
      '</div>';
  }

  /* ---------------- export ---------------- */

  function exportRows() {
    var rows = [['id', 'parent', 'priority', 'initiative', 'initiative_title', 'task', 'owner', 'start', 'due', 'status', 'note']];
    scopedPriorities().forEach(function (p) {
      p.initiatives.forEach(function (o) {
        allRows().filter(function (t) { return t.obj === o.id; }).forEach(function (t) {
          rows.push([t.id, t.parent || '', 'Priority ' + p.n + ' · ' + p.title, o.id, o.title,
                     t.title, t.owner, t.start, t.due, STATUS_LABEL[t.status], t.note]);
        });
      });
    });
    return rows;
  }
  function toCSV(rows) {
    return rows.map(function (r) {
      return r.map(function (c) {
        c = String(c == null ? '' : c);
        return /[",\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(',');
    }).join('\r\n');
  }
  function exportJSON() {
    var pris = scopedPriorities();
    return JSON.stringify({
      client: P.client, exported: TODAY,
      scope: state.sub[state.section] === 'all' ? 'whole plan' : pris[0].title,
      priorities: pris.map(function (p) {
        return {
          id: p.id, n: p.n, title: p.title, thesis: p.thesis, kpis: p.kpis,
          evidence: p.evidence.map(function (e) {
            var th = themeById[e];
            return th ? { id: th.id, category: th.cat, name: th.name, sources: th.n } : { id: e };
          }),
          initiatives: p.initiatives.map(function (o) {
            return {
              id: o.id, title: o.title, detail: o.detail, evidence: o.evidence,
              tasks: allRows().filter(function (t) { return t.obj === o.id && !t.parent; }).map(function (t) {
                return {
                  id: t.id, title: t.title, owner: t.owner, start: t.start, due: t.due,
                  status: t.status, note: t.note,
                  subtasks: subsOf(t.id).map(function (s) { return { id: s.id, title: s.title, status: s.status }; })
                };
              })
            };
          })
        };
      })
    }, null, 2);
  }
  function blobSave(filename, text, mime) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: mime }));
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) {}
  }
  function deliver(filename, text, mime) {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) {
        if (d) return d.save({ filename: filename, data: text });
        blobSave(filename, text, mime);
      }).catch(function () { blobSave(filename, text, mime); });
    } else {
      blobSave(filename, text, mime);
    }
  }
  function scopeSlug() {
    var s = state.sub[state.section];
    return (P.client.name + '-' + (s === 'all' ? 'plan' : s)).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  }

  function exportMenu() {
    var s = state.sub[state.section];
    var p = P.plan.priorities.filter(function (x) { return x.id === s; })[0];
    var label = s === 'all' ? 'the whole plan' : 'Priority ' + p.n + ' · ' + p.title;
    return '<div class="scrim" id="scrim"></div><div class="modal" role="dialog" aria-label="Export">' +
      '<span class="eyebrow">Export</span><h3 style="margin-top:3px">Take it with you</h3>' +
      '<p style="font-size:13.5px;color:var(--ink-2);margin-top:8px">Scoped to <strong style="color:var(--ink);font-weight:500">' + esc(label) + '</strong>, from the bar above.</p>' +
      '<div style="display:flex;flex-direction:column;gap:9px;margin-top:16px">' +
        '<button class="ghost expopt" data-exp="pdf"><strong>Board packet (PDF)</strong><br>' +
          '<span>Opens your print dialog. The plan with the chrome stripped — this is the PDF you used to build by hand.</span></button>' +
        '<button class="ghost expopt" data-exp="csv"><strong>Workplan (CSV)</strong><br>' +
          '<span>Tasks and subtasks with owners, dates and status. Opens in Excel; imports to Asana or ClickUp.</span></button>' +
        '<button class="ghost expopt" data-exp="json"><strong>Everything (JSON)</strong><br>' +
          '<span>Priorities, KPIs, initiatives, tasks, subtasks, and the findings each one cites.</span></button></div>' +
      '<p class="savenote">Files are named ' + esc(scopeSlug()) + '-*</p>' +
      '<div style="margin-top:14px;text-align:right"><button class="ghost" id="closeModal">Close</button></div></div>';
  }

  /* ---------------- overlays ---------------- */

  var authState = { step: 'email', email: '', err: '', busy: false };

  function authModal() {
    return '<div class="scrim" id="scrim"></div><div class="modal" role="dialog" aria-label="Sign in">' +
      '<span class="eyebrow">' + esc(P.client.name) + '</span><h3 style="margin-top:3px">Sign in</h3>' +
      (authState.step === 'email'
        ? '<p style="font-size:13.5px;color:var(--ink-2);margin-top:8px">We email you a one-time code. No password, and nothing to click in the message.</p>' +
          '<div class="field"><label class="eyebrow" for="fEmail">Email</label>' +
          '<input id="fEmail" type="email" autocomplete="email" value="' + esc(authState.email) + '" placeholder="you@organization.org" /></div>' +
          '<div style="margin-top:15px;display:flex;gap:8px;justify-content:flex-end">' +
          '<button class="ghost" id="closeModal">Cancel</button>' +
          '<button class="solid" id="authSend"' + (authState.busy ? ' disabled' : '') + '>' + (authState.busy ? 'Sending…' : 'Send code') + '</button></div>'
        : '<p style="font-size:13.5px;color:var(--ink-2);margin-top:8px">We sent a code to <strong style="color:var(--ink);font-weight:500">' + esc(authState.email) + '</strong>.</p>' +
          '<div class="field"><label class="eyebrow" for="fCode">Code</label>' +
          '<input id="fCode" class="code" inputmode="numeric" autocomplete="one-time-code" placeholder="······" /></div>' +
          '<div style="margin-top:15px;display:flex;gap:8px;justify-content:flex-end">' +
          '<button class="ghost" id="authBack">Back</button>' +
          '<button class="solid" id="authVerify"' + (authState.busy ? ' disabled' : '') + '>' + (authState.busy ? 'Checking…' : 'Sign in') + '</button></div>') +
      (authState.err ? '<p class="errnote">' + esc(authState.err) + '</p>' : '') + '</div>';
  }

  function renderOverlay() {
    var host = document.getElementById('overlay');
    if (state.modal === 'export') { host.innerHTML = exportMenu(); return; }
    if (state.modal === 'auth') { host.innerHTML = authModal(); return; }
    if (!state.openTask) { host.innerHTML = ''; return; }

    var t = taskOf(seedById[state.openTask]);
    var o = initById[t.obj], p = priOf(t.obj), ro = !canEdit(), subs = subsOf(t.id);

    host.innerHTML = '<div class="scrim" id="scrim"></div>' +
      '<aside class="drawer" role="dialog" aria-label="Task ' + t.id + '">' +
        '<div class="drawer-head"><div><span class="eyebrow">' + t.id + ' · Priority ' + p.n + ' · Initiative ' + o.id + '</span>' +
        '<h3>' + esc(t.title) + '</h3></div><button class="ghost" id="closeDrawer">Close</button></div>' +
        '<div class="callout" style="margin:16px 0 0"><span aria-hidden="true">↳</span>' +
        '<span>Serves <strong style="font-weight:500;color:var(--ink)">' + esc(o.title) + '</strong>, which came from ' +
        (o.evidence || []).length + ' findings.</span></div>' + evidenceRow(o.evidence, 'Traces to') +
        '<div class="field"><label class="eyebrow" for="fStatus">Status</label><select id="fStatus"' + (ro ? ' disabled' : '') + '>' +
          STATUS_ORDER.map(function (s) {
            return '<option value="' + s + '"' + (t.status === s ? ' selected' : '') + '>' + STATUS_LABEL[s] + '</option>';
          }).join('') + '</select></div>' +
        '<div class="field"><label class="eyebrow" for="fOwner">Owner</label><input id="fOwner" value="' + esc(t.owner) + '"' + (ro ? ' disabled' : '') + ' /></div>' +
        '<div class="field"><label class="eyebrow" for="fDue">Due</label><input id="fDue" type="date" value="' + t.due + '"' + (ro ? ' disabled' : '') + ' /></div>' +
        '<div class="field"><label class="eyebrow" for="fNote">Notes</label><textarea id="fNote" placeholder="What happened, what is next, what is in the way…"' + (ro ? ' disabled' : '') + '>' + esc(t.note) + '</textarea></div>' +
        (subs.length ? '<div class="sublist"><h4 class="eyebrow" style="margin-bottom:8px">Subtasks · ' +
          subs.filter(function (s) { return s.status === 'done'; }).length + ' of ' + subs.length + '</h4>' +
          subs.map(function (s) {
            return '<div class="subrow ' + s.status + '"><button class="statusbtn" data-cycle="' + s.id + '"' + (ro ? ' disabled' : '') +
              ' title="' + STATUS_LABEL[s.status] + '" aria-label="' + esc(s.title) + ' — ' + STATUS_LABEL[s.status] + '">' +
              '<span class="dot sm ' + s.status + '"></span></button><span>' + esc(s.title) + '</span></div>';
          }).join('') + '</div>' : '') +
        (t.dep ? '<p class="savenote">Waits on ' + t.dep + ' · ' + esc((seedById[t.dep] || {}).title || '') + '</p>' : '') +
        '<p class="savenote">' + (ro ? 'Read-only in this view.'
          : state.mode === 'supabase' ? 'Saves to Supabase for everyone on this portal.'
          : state.mode === 'artifact' ? 'Saves for everyone with this link.'
          : 'Saving to this browser only.') + '</p></aside>';
  }

  /* ---------------- render ---------------- */

  function render() {
    renderMast(); renderNav(); renderSubnav();
    document.getElementById('view').innerHTML =
      state.section === 'scope' ? renderScope() :
      state.section === 'plan' ? renderPlan() :
      state.section === 'findings' ? renderFindings() :
      state.section === 'workplan' ? renderWorkplan() : renderDashboard();
    renderOverlay();
  }

  function saveTask(id, patch) {
    var cur = taskOf(seedById[id]);
    var row = { title: cur.title, owner: cur.owner, start: cur.start, due: cur.due, status: cur.status, note: cur.note };
    Object.keys(patch).forEach(function (k) { row[k] = patch[k]; });
    state.overrides[id] = row;
    state.saveErr = false;
    render();
    Store.save(id, row).catch(function () { state.saveErr = true; renderMast(); });
  }

  /* ---------------- events ---------------- */

  var SEL = '[data-sec],[data-sub],[data-phase],[data-theme],[data-goto-theme],[data-goto-init],' +
    '[data-goto-tasks],[data-wpf],[data-wpg],[data-task],[data-cycle],[data-twist],[data-exp],' +
    '#backThemes,#moreQuotes,#scrim,#closeDrawer,#closeModal,#exportBtn,#roleBoard,#roleStaff,' +
    '#signIn,#signOut,#authSend,#authVerify,#authBack,#dashTableBtn';

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest(SEL) : null;
    if (!el) return;
    var d = el.dataset;

    if (d.sec) { state.section = d.sec; state.openTask = null; state.modal = null; window.scrollTo(0, 0); return render(); }
    if (d.sub !== undefined) { state.sub[state.section] = d.sub; state.openTheme = null; window.scrollTo(0, 0); return render(); }
    if (el.id === 'roleBoard' || el.id === 'roleStaff') { state.role = el.id === 'roleStaff' ? 'staff' : 'board'; return render(); }
    if (el.id === 'exportBtn') { state.modal = 'export'; return renderOverlay(); }
    if (el.id === 'closeModal' || el.id === 'scrim') { state.modal = null; state.openTask = null; return renderOverlay(); }
    if (el.id === 'closeDrawer') { state.openTask = null; return renderOverlay(); }
    if (d.phase) { state.openPhase = d.phase; return render(); }

    if (d.theme || d.gotoTheme) {
      state.openTheme = d.theme || d.gotoTheme;
      state.showAllQuotes = false; state.section = 'findings'; state.sub.findings = 'ALL';
      state.openTask = null; state.modal = null; window.scrollTo(0, 0);
      return render();
    }
    if (el.id === 'backThemes') { state.openTheme = null; return render(); }
    if (el.id === 'moreQuotes') { state.showAllQuotes = !state.showAllQuotes; return render(); }
    if (el.id === 'dashTableBtn') { state.dashTable = !state.dashTable; return render(); }

    if (d.gotoTasks) {
      var pa = priOf(d.gotoTasks);
      state.section = 'workplan'; state.sub.workplan = pa ? pa.id : 'all';
      state.wpFilter = 'all'; state.wpGroup = 'initiative';
      state.openTask = null; state.openTheme = null; state.modal = null;
      render();
      var hd = [].slice.call(document.querySelectorAll('.initgroup-head .ig-id'))
        .filter(function (n) { return n.textContent === d.gotoTasks; })[0];
      if (hd) hd.closest('.initgroup').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (d.gotoInit !== undefined) {
      var pb = d.gotoInit ? priOf(d.gotoInit) : null;
      state.section = 'plan'; state.sub.plan = pb ? pb.id : 'all';
      state.openTheme = null; state.openTask = null; state.modal = null;
      render();
      var box = d.gotoInit ? document.getElementById('init-' + d.gotoInit) : null;
      if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' }); else window.scrollTo(0, 0);
      return;
    }

    if (d.wpf) { state.wpFilter = d.wpf; return render(); }
    if (d.wpg) { state.wpGroup = d.wpg; return render(); }
    if (d.twist) { state.expanded[d.twist] = !state.expanded[d.twist]; return render(); }
    if (d.task) { state.openTask = d.task; return renderOverlay(); }

    if (d.cycle && canEdit()) {
      var t = taskOf(seedById[d.cycle]);
      return saveTask(t.id, { status: STATUS_ORDER[(STATUS_ORDER.indexOf(t.status) + 1) % STATUS_ORDER.length] });
    }

    if (d.exp) {
      var slug = scopeSlug();
      state.modal = null;
      if (d.exp === 'pdf') { renderOverlay(); return window.print(); }
      if (d.exp === 'csv') deliver(slug + '-workplan.csv', toCSV(exportRows()), 'text/csv');
      if (d.exp === 'json') deliver(slug + '.json', exportJSON(), 'application/json');
      return renderOverlay();
    }

    // ---- account
    if (el.id === 'signIn') { authState = { step: 'email', email: '', err: '', busy: false }; state.modal = 'auth'; return renderOverlay(); }
    if (el.id === 'authBack') { authState.step = 'email'; authState.err = ''; return renderOverlay(); }
    if (el.id === 'authSend') {
      var em = ((document.getElementById('fEmail') || {}).value || '').trim();
      if (!/.+@.+\..+/.test(em)) { authState.err = 'That does not look like an email address.'; return renderOverlay(); }
      authState.email = em; authState.busy = true; authState.err = '';
      renderOverlay();
      Store.backends.supabase.signIn(em).then(function (r) {
        authState.busy = false;
        if (r && r.error) authState.err = r.error.message; else authState.step = 'code';
        renderOverlay();
      }).catch(function (e) {
        authState.busy = false;
        authState.err = (e && e.message) || 'Could not send the code.';
        renderOverlay();
      });
      return;
    }
    if (el.id === 'authVerify') {
      var code = ((document.getElementById('fCode') || {}).value || '').trim();
      if (!code) { authState.err = 'Type the code from the email.'; return renderOverlay(); }
      authState.busy = true; authState.err = '';
      renderOverlay();
      Store.backends.supabase.verify(authState.email, code).then(function (r) {
        authState.busy = false; state.modal = null;
        state.role = r.role || 'board'; state.user = r.user; state.mode = 'supabase';
        render();
      }).catch(function (e) {
        authState.busy = false;
        authState.err = (e && e.message) || 'That code did not work. Codes expire after about an hour.';
        renderOverlay();
      });
      return;
    }
    if (el.id === 'signOut') {
      Store.backends.supabase.signOut().then(function () {
        state.user = null; state.role = 'board'; state.overrides = {};
        render();
      });
      return;
    }
  });

  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'themeSearch') return;
    state.q = ev.target.value;
    var pos = ev.target.selectionStart;
    render();
    var again = document.getElementById('themeSearch');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  });

  document.addEventListener('change', function (ev) {
    if (!state.openTask || !canEdit()) return;
    var id = state.openTask;
    if (ev.target.id === 'fStatus') saveTask(id, { status: ev.target.value });
    if (ev.target.id === 'fOwner') saveTask(id, { owner: ev.target.value });
    if (ev.target.id === 'fDue') saveTask(id, { due: ev.target.value });
    if (ev.target.id === 'fNote') saveTask(id, { note: ev.target.value });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (state.modal) { state.modal = null; renderOverlay(); }
    else if (state.openTask) { state.openTask = null; renderOverlay(); }
    else if (state.openTheme) { state.openTheme = null; render(); }
  });

  /* ---------------- boot ---------------- */

  document.getElementById('brandName').textContent = P.client.name;
  document.getElementById('brandSub').textContent = P.client.engagement + ' · ' + P.client.place;

  Store.onChange(render);
  render();
  Store.init().then(function (r) {
    if (!r) return;
    state.mode = r.mode;
    if (r.role) state.role = r.role;
    if (r.user) state.user = r.user;
    render();
  });
})();
</script>
